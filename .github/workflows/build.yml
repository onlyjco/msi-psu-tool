name: Build release

# Only runs on version tags, so the repository itself stays free of binaries
# while every tagged release gets downloadable executables built here from
# source (with a public build log anyone can check).
on:
  push:
    tags:
      - "v*"

# gh release create needs write access to the repository contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install pyinstaller

      # --add-data takes an absolute source path here; forward slashes are
      # accepted on Windows and avoid YAML escape problems with backslashes.
      - name: Build the GUI executable
        run: >
          python -m PyInstaller
          --onefile --windowed
          --name "MSI PSU Control"
          --distpath dist --workpath build --specpath build
          --paths src
          --hidden-import i18n
          --hidden-import msi_psu_dashboard
          --hidden-import win_dpi
          --add-data "${{ github.workspace }}/assets;assets"
          src/msi_psu_app.py

      - name: Build the CLI executable
        run: >
          python -m PyInstaller
          --onefile --console
          --name "msi-psu-cli"
          --distpath dist --workpath build --specpath build
          --paths src
          --hidden-import i18n
          src/msi_psu.py

      - name: Fail if either executable is missing
        shell: pwsh
        run: |
          $want = @("MSI PSU Control.exe", "msi-psu-cli.exe")
          foreach ($f in $want) {
            if (-not (Test-Path "dist\$f")) { throw "missing dist\$f" }
            Write-Host ("OK {0}  {1:N2} MB" -f $f, ((Get-Item "dist\$f").Length / 1MB))
          }

      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(),
                          $_.Name
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt | Write-Host

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the annotated tag's message as the release body when the tag
          # carries one (that is where the hand-written highlights live), and
          # fall back to the generated commit list otherwise.
          #
          # The check must be the tag OBJECT type: asking for '%(contents)'
          # also returns the commit message for a lightweight tag, which would
          # wrongly select --notes-from-tag.
          notes_flag="--generate-notes"
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}" 2>/dev/null)" = "tag" ]; then
            notes_flag="--notes-from-tag"
          fi
          echo "release notes mode: ${notes_flag}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            "${notes_flag}" \
            "dist/MSI PSU Control.exe" \
            "dist/msi-psu-cli.exe" \
            "dist/SHA256SUMS.txt"
